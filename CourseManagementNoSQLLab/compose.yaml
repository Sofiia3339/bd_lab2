services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "shared_buffers=128MB"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_local
      POSTGRES_DB: course_nosql_lab
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d course_nosql_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:7.0.23
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "127.0.0.1:57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.2
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
